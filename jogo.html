<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Servente e Pedreiro - Construção</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;touch-action:none}
body{background:#87CEEB;overflow:hidden}
#game{width:100vw;height:100vh;position:relative;background:linear-gradient(#87CEEB 0%, #87CEEB 60%, #d2b48c 60%)}
#hud{position:absolute;top:0;left:0;right:0;background:#222;color:#fff;padding:10px;display:flex;justify-content:space-between;z-index:10}
#muro{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center}
.tijolo{width:60px;height:20px;background:#c1440e;border:2px solid #7a2a0a;margin:1px;border-radius:2px}
#monte{position:absolute;bottom:80px;left:20px;width:80px;height:80px;background:#a0522d;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px}
#pedreiro{position:absolute;bottom:80px;left:55%;font-size:50px;transition:0.3s}
#servente{position:absolute;bottom:80px;left:30%;font-size:50px;z-index:5}
#joystick{position:absolute;bottom:20px;left:20px;width:120px;height:120px;background:rgba(0,0,0,0.2);border-radius:50%}
#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;background:#fff;border-radius:50%}
#btnPegar{position:absolute;bottom:30px;right:20px;padding:20px 30px;background:#e50914;color:#fff;border:none;border-radius:50px;font-weight:bold;font-size:18px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;border-radius:10px;text-align:center;display:none;z-index:20}
</style>
</head>
<body>
<div id="game">
<div id="hud"><span>🧱 Tijolos: <b id="tijolos">0</b></span><span>Muro: <b id="altura">0</b>/20</span><span>💰 R$ <b id="dinheiro">0</b></span></div>
<div id="monte">🧱<div style="position:absolute;bottom:-20px;font-size:12px;color:#000;background:#fff;padding:2px 5px;border-radius:5px">MONTE</div></div>
<div id="muro"></div>
<div id="pedreiro">👷‍♂️</div>
<div id="servente">👷</div>
<div id="joystick"><div id="stick"></div></div>
<button id="btnPegar" onclick="acao()">PEGAR</button>
<div id="msg"></div>
</div>
<script>
let x=30, y=0, carregando=false, tijolos=0, altura=0, dinheiro=0;
let pedreiroX=55;
const serventeEl=document.getElementById('servente');
const pedreiroEl=document.getElementById('pedreiro');
const muroEl=document.getElementById('muro');

function update(){
 serventeEl.style.left=x+'%';
 serventeEl.innerHTML=carregando?'👷‍♂️🧱':'👷';
 document.getElementById('tijolos').innerText=tijolos;
 document.getElementById('altura').innerText=altura;
 document.getElementById('dinheiro').innerText=dinheiro;
 document.getElementById('btnPegar').innerText=carregando?'ENTREGAR':'PEGAR';
}

function acao(){
 // perto do monte
 if(x<25 &&!carregando){ carregando=true; tijolos++; update(); return; }
 // perto do pedreiro
 if(Math.abs(x-pedreiroX)<8 && carregando){
   carregando=false; tijolos--;
   altura++; dinheiro+=15;
   let b=document.createElement('div'); b.className='tijolo'; muroEl.appendChild(b);
   pedreiroEl.innerHTML='👷‍♂️🔨';
   setTimeout(()=>pedreiroEl.innerHTML='👷‍♂️',300);
   if(altura>=20){ vencer(); }
   update();
 }
}

function vencer(){
 document.getElementById('msg').style.display='block';
 document.getElementById('msg').innerHTML='<h2>🏆 OBRA CONCLUÍDA!</h2><p>Você e o pedreiro levantaram o muro!</p><p>R$ '+dinheiro+'</p><br><button onclick="location.reload()" style="padding:10px 20px;background:#23a559;color:#fff;border:none;border-radius:5px">JOGAR DE NOVO</button>';
}

// controles
let joy=document.getElementById('joystick'), stick=document.getElementById('stick'), dragging=false;
joy.addEventListener('touchstart',()=>dragging=true);
joy.addEventListener('touchend',()=>{dragging=false; stick.style.left='35px'; stick.style.top='35px';});
joy.addEventListener('touchmove',e=>{
 if(!dragging)return;
 let r=joy.getBoundingClientRect();
 let tx=e.touches[0].clientX-r.left-60, ty=e.touches[0].clientY-r.top-60;
 if(tx<-40) x-=1.5; if(tx>40) x+=1.5;
 if(x<5) x=5; if(x>85) x=85;
 stick.style.left=(35+tx/3)+'px'; stick.style.top=(35+ty/3)+'px';
 update();
});

// teclado PC
document.addEventListener('keydown',e=>{
 if(e.key=='ArrowLeft' || e.key=='a') x-=3;
 if(e.key=='ArrowRight' || e.key=='d') x+=3;
 if(e.key==' ') acao();
 if(x<5) x=5; if(x>85) x=85;
 update();
});
update();
</script>
</body>
</html>
