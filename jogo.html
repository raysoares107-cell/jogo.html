<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Bag Factory Simulator - Catalão</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff}
#hud{background:#000;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0}
#factory{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.maquina{background:#222;border-radius:12px;padding:15px;text-align:center;border:2px solid #333;cursor:pointer}
.maquina.ativa{border-color:#e50914;background:#2a1a1a}
.maquina h3{margin:5px 0}
.bar{height:12px;background:#000;border-radius:10px;margin:10px 0;overflow:hidden}
.fill{height:100%;width:0%;background:#23a559;transition:.2s}
.btn{padding:12px;background:#e50914;color:#fff;border:none;border-radius:6px;font-weight:bold;width:100%;margin-top:10px}
#produto{grid-column:1/3;background:#1a1a1a;border-radius:12px;padding:20px;text-align:center}
.bag{font-size:60px}
</style>
</head>
<body>
<div id="hud"><span>🧵 Big Bag Factory</span><span>R$ <b id="money">0</b></span><span>📦 Feitos: <b id="total">0</b></span></div>
<div style="padding:10px;font-size:12px;color:#888">Jogo fictício inspirado no trabalho de operador de célula de produção - processo genérico de sacaria</div>

<div id="factory">
<div class="maquina" id="m1" onclick="trabalhar(1)"><h3>1️⃣ TEAR</h3><p>Tecer o tecido</p><div class="bar"><div class="fill" id="f1"></div></div><button class="btn">TEAR</button></div>
<div class="maquina" id="m2" onclick="trabalhar(2)"><h3>2️⃣ CORTE</h3><p>Cortar painéis</p><div class="bar"><div class="fill" id="f2"></div></div><button class="btn">CORTAR</button></div>
<div class="maquina" id="m3" onclick="trabalhar(3)"><h3>3️⃣ COSTURA</h3><p>Costurar alças</p><div class="bar"><div class="fill" id="f3"></div></div><button class="btn">COSTURAR</button></div>
<div class="maquina" id="m4" onclick="trabalhar(4)"><h3>4️⃣ PRENSA / FINAL</h3><p>Prensar e conferir</p><div class="bar"><div class="fill" id="f4"></div></div><button class="btn">FINALIZAR</button></div>

<div id="produto">
<div class="bag" id="bagIcon">📦</div>
<h2 id="status">Comece no TEAR</h2>
<p id="etapa">Etapa 0/4</p>
</div>
</div>

<script>
let etapa=0, money=0, total=0;
let progresso=[0,0,0,0,0];
function trabalhar(num){
 if(num!==etapa+1){ document.getElementById('status').innerText='Tem que seguir a ordem! Vai pra etapa '+(etapa+1); return; }
 let fill=document.getElementById('f'+num);
 let maq=document.getElementById('m'+num);
 maq.classList.add('ativa');
 let p=0;
 let int=setInterval(()=>{
  p+=10; progresso[num]=p; fill.style.width=p+'%';
  if(p>=100){ clearInterval(int); maq.classList.remove('ativa'); etapa=num; if(etapa==4){ finalizarBag(); etapa=0; progresso=[0,0,0,0,0]; document.querySelectorAll('.fill').forEach(f=>f.style.width='0%'); } atualizar(); }
 },80);
}
function atualizar(){
 document.getElementById('etapa').innerText='Etapa '+etapa+'/4';
 let textos=['Comece no TEAR','Tecido pronto! Vai pro CORTE','Cortado! Vai pra COSTURA','Costurado! Vai pra PRENSA',''];
 document.getElementById('status').innerText=textos[etapa];
}
function finalizarBag(){
 total++; money+=35;
 document.getElementById('total').innerText=total;
 document.getElementById('money').innerText=money;
 document.getElementById('bagIcon').innerHTML='✅📦';
 document.getElementById('status').innerText='BIG BAG PRONTO! +R$35';
 setTimeout(()=>{document.getElementById('bagIcon').innerHTML='📦'; atualizar();},1000);
}
atualizar();
</script>
</body>
</html>
